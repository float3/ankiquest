[package]
name = "ankiquest-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Repository tools: the Android API contract guard, the Android art exporter and the README banner"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.49", default-features = false, features = ["text"] }
serde_json = "1"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
