[package]
name = "ankiquest"
version = "0.1.0"
authors = ["hill <hill@hilll.dev>"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/float3/ankiquest"

[workspace]
members = [".", "crates/i18n", "crates/i18n-wasm"]

[dependencies]
ankiquest-i18n = { path = "crates/i18n" }
argon2 = "0.6"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
getrandom = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.49", default-features = false, features = ["text"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
skrifa = "0.44"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
ureq = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Password hashing is slow unoptimised, and the account tests hash a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The translation module for the web pages, built by build.rs.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
