name: CI

on:
  # Pushes to the default branch, and every pull request. Pushes to other
  # branches are left to their pull request: checking both ran every job
  # twice on the same commit.
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build the server
        run: rustup target add wasm32-unknown-unknown && cargo build

      - name: Browser tests
        run: npm run test:web

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test
        run: nix develop --command cargo test --workspace

      - name: Test desktop deck completion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqt
          "$RUNNER_TEMP/aqt/bin/python" -m unittest discover -s tests -v

      - name: Lint
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the package
        run: nix build --print-build-logs

      - name: Evaluate the NixOS module
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake "git+file://'"$PWD"'";
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    boot.isContainer = true;
                    system.stateVersion = "26.05";
                    services.nginx.enable = true;
                    security.acme.acceptTerms = true;
                    security.acme.defaults.email = "ci@example.com";
                    services.ankiquest = {
                      enable = true;
                      domain = "anki.example.com";
                      privateSite = true;
                      sitePasswordFile = "/run/secrets/ankiquest-site-password";
                      ntfy = "https://ntfy.sh";
                      users.hill = {
                        ntfyTopic = "example";
                        tokenFile = "/run/secrets/ankiquest-hill";
                      };
                    };
                  }
                ];
              };
            in system.config.system.build.toplevel.drvPath'
