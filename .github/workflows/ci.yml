name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Build the server
        run: cargo build

      - name: Browser tests
        run: npm run test:web

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test
        run: nix develop --command cargo test

      - name: Test desktop deck completion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqt
          "$RUNNER_TEMP/aqt/bin/python" -m unittest discover -s tests -v

      - name: Lint
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Build the package
        run: nix build --print-build-logs

      - name: Evaluate the NixOS module
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake "git+file://'"$PWD"'";
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    boot.isContainer = true;
                    system.stateVersion = "26.05";
                    services.nginx.enable = true;
                    security.acme.acceptTerms = true;
                    security.acme.defaults.email = "ci@example.com";
                    services.ankiquest = {
                      enable = true;
                      domain = "anki.example.com";
                      privateSite = true;
                      sitePasswordFile = "/run/secrets/ankiquest-site-password";
                      ntfy = "https://ntfy.sh";
                      users.hill = {
                        ntfyTopic = "example";
                        tokenFile = "/run/secrets/ankiquest-hill";
                      };
                    };
                  }
                ];
              };
            in system.config.system.build.toplevel.drvPath'
