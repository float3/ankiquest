name: CI

on:
  # Pushes to the default branch, and every pull request. Pushes to other
  # branches are left to their pull request: checking both ran every job
  # twice on the same commit.
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: |
          bash .github/scripts/ubuntu-archive.sh
          npm ci && npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build the server
        run: rustup target add wasm32-unknown-unknown && cargo build

      - name: Browser tests
        run: npm run test:web

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Test
        run: nix develop --command cargo test --workspace

      - name: Lint
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

  desktop:
    name: Desktop (Anki ${{ matrix.anki }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki: '23.10'
            python: '3.9'
          - anki: '26.9.4'
            python: '3.12'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-anki-${{ matrix.anki }}.txt
      - name: Install Anki and Qt
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64
          python -m pip install -r tests/requirements-anki-${{ matrix.anki }}.txt
      - name: Lint the add-on
        run: python -m pyflakes addon
      - name: Test the add-on and its real Anki APIs
        run: python -m unittest discover -s tests -v

  addon-package:
    name: Add-on archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test and build the archive
        run: |
          python3 -m unittest discover -s tests -p test_addon_package.py -v
          python3 .github/scripts/package-addon.py --output ankiquest.ankiaddon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiquest-addon
          path: ankiquest.ankiaddon
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package
        run: nix build --print-build-logs

      - name: Evaluate the NixOS module
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake "git+file://'"$PWD"'";
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    boot.isContainer = true;
                    system.stateVersion = "26.05";
                    services.nginx.enable = true;
                    security.acme.acceptTerms = true;
                    security.acme.defaults.email = "ci@example.com";
                    services.ankiquest = {
                      enable = true;
                      domain = "anki.example.com";
                      privateSite = true;
                      sitePasswordFile = "/run/secrets/ankiquest-site-password";
                      ntfy = "https://ntfy.sh";
                      users.hill = {
                        ntfyTopic = "example";
                        tokenFile = "/run/secrets/ankiquest-hill";
                      };
                    };
                  }
                ];
              };
            in system.config.system.build.toplevel.drvPath'
