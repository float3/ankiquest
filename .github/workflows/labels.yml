name: Pull Request Labels

# Keeps pull request labels current:
# - area labels from the changed paths (.github/labeler.yml)
# - "needs review" while a pull request is open and not a draft
# - "new contributor" on a first pull request from someone new to the repo
# - workflow labels are cleared when a pull request is closed
#
# pull_request_target runs the base branch's workflow with a token that can
# label pull requests from forks. Nothing here checks out or runs pull
# request code: the jobs only read the event payload and the GitHub API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  area:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  status:
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const has = (name) => pr.labels.some((label) => label.name === name);

            async function add(name) {
              if (has(name)) return;
              core.info(`Adding "${name}"`);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            }

            async function remove(name) {
              if (!has(name)) return;
              core.info(`Removing "${name}"`);
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            switch (context.payload.action) {
              case 'closed':
                await remove('needs review');
                await remove('conflicts');
                break;
              case 'converted_to_draft':
                await remove('needs review');
                break;
              default: // opened, reopened, ready_for_review
                if (!pr.draft) await add('needs review');
            }

            const newcomer = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'NONE'];
            if (context.payload.action === 'opened' && newcomer.includes(pr.author_association)) {
              await add('new contributor');
            }
