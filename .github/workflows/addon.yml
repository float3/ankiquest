name: Desktop add-on

on:
  push:
    tags: ["addon-*"]
    branches: [master]
    paths: ["addon/**", ".github/workflows/addon.yml", ".github/scripts/package-addon.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          python3 .github/scripts/package-addon.py --output ankiquest.ankiaddon \
            --ref "$GITHUB_REF" --metadata addon-nightly.json
          echo "release=$(jq -r .release addon-nightly.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/addon-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ankiquest.ankiaddon \
            --title "Desktop add-on ${GITHUB_REF_NAME#addon-}" \
            --notes "Double-click ankiquest.ankiaddon or choose Tools → Add-ons → Install from file, then restart Anki. Sign in or create an account when AnkiQuest asks, or later from Tools → AnkiQuest: sign in or create account. Passwords are sent only over HTTPS unless the server is on your local network. Switch account, Sign out and Manual connection (server, player and token) are in Tools → AnkiQuest settings."

      - name: Publish nightly
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          gh release delete addon-nightly --yes --cleanup-tag || true
          gh release create addon-nightly ankiquest.ankiaddon addon-nightly.json \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Desktop add-on nightly" \
            --notes "Built from $GITHUB_SHA after addon-$RELEASE. Untested: choose the nightly update channel in ankiquest settings to get these."
