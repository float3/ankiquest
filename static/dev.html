<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="robots" content="noindex,nofollow">
<title>Dev · AnkiQuest</title>
<link rel="icon" href="/aki/face.png" type="image/png">
<link rel="stylesheet" href="/site.css">
<script src="/site.js"></script>
<style>
.dev{display:grid;gap:20px;padding:28px 0}
.dev h1{font-size:30px}
.dev form{display:grid;gap:12px}
.dev form input[type=text],.dev form textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.dev textarea{min-height:70px;resize:vertical}
.dev fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;min-width:0}
.dev fieldset label{display:flex;align-items:center;gap:8px}
.dev-groups{display:grid;gap:6px;max-height:220px;overflow:auto}
.dev table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.dev th,.dev td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dev td.n,.dev th.n{text-align:right}
.dev .bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}
.dev-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dev-list li{border-bottom:1px solid var(--line);padding-bottom:10px;overflow-wrap:anywhere}
.dev-list small{display:block}
.dev .table-wrap{overflow-x:auto}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>
<div class="shell">
  <header class="topbar" data-site-header data-site-section="dev"></header>
  <main id="app" class="dev" tabindex="-1" aria-busy="true"><p class="loading-copy" role="status">Loading…</p></main>
</div>
<script data-entry="pages/dev"></script>
</body>
</html>
