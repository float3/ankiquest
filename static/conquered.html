<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="robots" content="noindex,nofollow">
<title data-i18n="Card conquered · AnkiQuest">Card conquered · AnkiQuest</title>
<link rel="icon" href="/aki/face.png" type="image/png">
<link rel="apple-touch-icon" href="/aki/face.png">
<link rel="stylesheet" href="/site.css">
<script src="/site.js"></script>
<style>
/* A big celebration card in the spirit of the companion's other milestone art. */
.conquest{--hue:#f2a33a;--hue-deep:#c46f12;--hue-soft:#fff3dc;max-width:560px;margin:56px auto 32px;position:relative;text-align:center}
.conquest.tamed{--hue:#6c5ce7;--hue-deep:#4534b8;--hue-soft:#efedff}
.conquest-hero{position:relative;background:linear-gradient(160deg,var(--hue),var(--hue-deep));border-radius:28px 28px 0 0;padding:28px 24px 20px;color:#fff;overflow:hidden}
.conquest-hero::before,.conquest-hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.conquest-hero::before{width:260px;height:260px;left:-70px;top:-90px}
.conquest-hero::after{width:180px;height:180px;right:-50px;bottom:-60px}
.conquest-hero .aki-art{position:relative;z-index:1;display:block;width:240px;height:240px;margin:0 auto -6px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.conquest-trophy{position:relative;z-index:1;font-size:120px;line-height:1.4}
.conquest-badge{position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.conquest-hero h1{position:relative;z-index:1;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:12px 0 4px;text-shadow:0 3px 0 var(--hue-deep)}
.conquest-hero .who{position:relative;z-index:1;font-size:15px;font-weight:700;opacity:.92}
.conquest-body{background:var(--card);border:2px solid var(--line);border-top:0;border-radius:0 0 28px 28px;padding:24px}
.conquest-body .lead{color:var(--ink);font-size:17px;line-height:1.55;margin:0 auto 22px;max-width:40ch}
.conquest-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:24px}
.conquest-stats div{background:var(--hue-soft);border:2px solid var(--hue);border-radius:18px;padding:14px 6px}
.conquest-stats b{display:block;font-size:32px;font-weight:900;color:var(--hue-deep);font-variant-numeric:tabular-nums}
.conquest-stats span{font-size:12px;font-weight:700;color:var(--hue-deep);text-transform:uppercase;letter-spacing:.06em}
.conquest-actions{display:grid;gap:10px}
.conquest-actions button{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.conquest-actions button:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.conquest-actions button.primary{background:var(--hue);border-color:var(--hue-deep);color:#fff}
.conquest-actions button:disabled{opacity:.6;cursor:default}
.conquest-actions .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* What the card was: a flashcard, slightly tilted, as large as it fits. */
.conquest-label{display:inline-block;max-width:100%;box-sizing:border-box;margin:0 auto 18px;padding:14px 22px;background:#fff;color:var(--hue-deep);border:2px solid var(--hue);border-bottom-width:5px;border-radius:18px;font-size:28px;font-weight:900;line-height:1.2;overflow-wrap:anywhere;transform:rotate(-1.5deg)}
.conquest-label-form{text-align:left;margin-top:18px;border:2px dashed var(--line);border-radius:16px;padding:12px 14px}
.conquest-label-form summary{cursor:pointer;font-weight:800}
.conquest-label-form form{margin-top:12px}
.conquest-label-form input{width:100%;box-sizing:border-box}
.conquest-label-controls{margin-top:14px}
.conquest-note{font-size:12px;color:var(--dim);margin:18px 0 6px}
@media(max-width:520px){.conquest{margin-top:24px}.conquest-hero h1{font-size:34px}.conquest-hero .aki-art{width:190px;height:190px}.conquest-stats b{font-size:25px}}
</style>
</head>
<body>
<a class="skip" href="#app"><span data-i18n="Skip to main content">Skip to main content</span></a>
<div class="shell">
  <header class="topbar" data-site-header data-site-section="leaderboard"></header>
  <main id="app" tabindex="-1" aria-busy="true"><p class="loading-copy" role="status"><span data-i18n="Loading…">Loading…</span></p></main>
</div>
<script data-entry="pages/conquered"></script>
</body>
</html>
