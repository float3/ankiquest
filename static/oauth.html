<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101418">
<meta name="robots" content="noindex,nofollow">
<title data-i18n="Sign in · ankiquest">Sign in · ankiquest</title>
<link rel="icon" href="/aki/face.png" type="image/png">
<link rel="stylesheet" href="/site.css">
<style>
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.oauth{max-width:420px;margin:12vh auto 48px;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.oauth-brand{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:750;color:inherit;text-decoration:none;margin-bottom:20px}.oauth-brand img{width:30px;height:30px}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 8px}
input{box-sizing:border-box;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:11px;font:inherit;color:inherit}input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
.oauth-button{display:block;box-sizing:border-box;width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:var(--accent);color:var(--card);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.oauth-message{font-size:15px;line-height:1.6;margin:0}
.oauth-error{font-size:13px;line-height:1.5;min-height:20px;color:var(--fire);margin:12px 0 0}
.oauth-privacy{font-size:12px;margin:4px 0 0}.oauth-privacy a{color:var(--dim)}
@media(max-width:520px){.oauth{margin:24px 16px;padding:24px 20px}}
</style>
</head>
<body>
<main class="oauth">
<a class="oauth-brand" href="/"><img src="/aki/face.png" alt=""><span>ankiquest</span></a>
{{body}}
</main>
<script src="/site.js"></script>
</body>
</html>
