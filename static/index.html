<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard · AnkiQuest</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#101418">
<link rel="stylesheet" href="/site.css">
<script src="/site.js"></script>
<style>
.dashboard { display: grid; gap: 20px; }
.dashboard > .page-hero { margin-bottom: -20px; }
.dashboard h2 .sub { font-weight: 400; }
.dashboard .section-title { margin-bottom: 18px; }
.profile-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.profile-layout > .wide { grid-column: 1 / -1; }
.profile-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; background: var(--goldbg); }
.profile-hero h2 { margin-bottom: 8px; }
.page-hero h1 { overflow-wrap: anywhere; }
.level {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
  border: 4px solid var(--gold); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums;
}
.level small { display: block; font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: -6px; text-align: center; }
.name { font-size: 22px; font-weight: 700; }
.sub { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { min-width: 0; text-align: left; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--dim); }
.fire b { color: var(--fire); }
.ice b { color: var(--ice); }
.risk { border-color: var(--fire); color: var(--fire); font-weight: 600; text-align: center; }
.quest { display: grid; gap: 2px; margin-bottom: 12px; }
.quest:last-child { margin-bottom: 0; }
.quest .row { display: flex; justify-content: space-between; gap: 8px; }
.quest.done .title { color: var(--ok); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; }
.heat i { width: 100%; min-width: 9px; aspect-ratio: 1; border-radius: 2px; background: var(--h0); }
.heat i.l1 { background: var(--h1); } .heat i.l2 { background: var(--h2); }
.heat i.l3 { background: var(--h3); } .heat i.l4 { background: var(--h4); }
.heat i.frozen { background: var(--ice); opacity: 0.55; }
.heat i.pad { visibility: hidden; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; }
.ach div.locked { opacity: 0.55; }
.ach div.got { border-color: var(--gold); }
.ach b { display: block; font-size: 14px; }
.ach .bar { height: 5px; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.board li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 12px; border-bottom: 1px solid var(--line); border-radius: 12px; }
.board li:last-child { border-bottom-color: transparent; }
.board .player-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.board .player-progress { flex: 1; min-width: 0; }
.board li.me { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.board li.lead { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.board li.lead.me { background: color-mix(in srgb, var(--gold) 12%, color-mix(in srgb, var(--accent) 14%, transparent)); }
.board .rank { font-size: 19px; text-align: center; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.board .line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.board .name { font-size: 16px; font-weight: 650; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .name:hover { text-decoration: underline; }
.board .streak { font-size: 12px; color: var(--fire); white-space: nowrap; }
.board .lvl { font-size: 12px; color: var(--dim); white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.board .bar { height: 5px; margin-top: 7px; }
.board .xp { text-align: right; font-variant-numeric: tabular-nums; min-width: 64px; }
.board .xp b { display: block; font-size: 17px; color: var(--accent); }
.board .xp span { font-size: 11px; color: var(--dim); white-space: nowrap; }
.records { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.record h3 { margin: 0 0 18px; font-size: 16px; font-weight: 650; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.record h3 em { font-size: 12px; color: var(--dim); font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; white-space: nowrap; }
.record .entry { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; }
.record .entry + .entry { margin-top: 14px; }
.record .place { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.record .entry a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record .entry a:hover { text-decoration: underline; }
.record .value { font-variant-numeric: tabular-nums; }
.record .value small { color: var(--dim); font-size: 11px; margin-left: 3px; }
.record .lead { font-size: 20px; font-weight: 700; }
.record .lead .place { font-size: 15px; }
.record .lead .value { color: var(--gold); }
.record .lead .value small { font-weight: 400; }
.record .chase { font-size: 14px; color: var(--dim); }
.record .chase .value { color: var(--ink); font-weight: 600; }
.record .bar { grid-column: 1 / -1; height: 6px; margin-top: 5px; }
.record .detail { color: var(--dim); font-size: 12px; margin-top: 3px; padding-left: 28px; }
.record .mine a { color: var(--accent); font-weight: 700; }
.winner-history { min-width: 0; }
.winner-history h2 { margin-bottom: 6px; }
.winner-history p { margin: 8px 0; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.win-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.winner-history a { color: var(--accent); }
.win-heading a { font-size: 12px; }
.win-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0 12px; }
.win-scopes { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--h0); border-radius: 10px; }
.winner-history button, .winner-history select { min-height: 44px; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); background: var(--card); }
.winner-history button { cursor: pointer; }
.win-scopes button { border-color: transparent; background: transparent; }
.win-scopes button[aria-pressed=true] { background: var(--card); font-weight: 700; }
.winner-history :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.win-sort { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.win-table { width: 100%; white-space: normal; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
.win-table th, .win-table td { border-bottom: 1px solid var(--line); padding: 12px 5px; text-align: right; font-variant-numeric: tabular-nums; }
.win-table th { color: var(--dim); font-size: 11px; font-weight: 600; }
.win-table th:first-child, .win-table td:first-child { width: 28px; text-align: left; padding-left: 0; color: var(--dim); }
.win-table th:nth-child(2), .win-table td:nth-child(2) { text-align: left; width: auto; overflow-wrap: anywhere; }
.win-table th:nth-child(n+3) { width: 48px; }
.win-table a { color: inherit; text-decoration: none; }
.win-table a:hover { text-decoration: underline; }
.win-table small { display: block; font-size: 10px; color: var(--dim); font-weight: 400; margin-top: 3px; }
.win-table tr:last-child td { border-bottom: 0; }
.win-table .win-selected { font-weight: 700; color: var(--accent); }
.win-table .win-waiting td { color: var(--dim); }
.win-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 420px) { .win-table th:nth-child(n+3) { width: 39px; } .win-table th, .win-table td { padding-left: 3px; padding-right: 3px; } }
.deck-sharing button, .deck-sharing input { font: inherit; }
.deck-sharing button:disabled { opacity: 0.55; cursor: default; }
dialog.deck-sharing { width: min(560px, calc(100% - 32px)); max-height: 85vh; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); }
dialog.deck-sharing::backdrop { background: #0008; }
.deck-sharing h3 { margin: 0; font-size: 18px; }
.deck-sharing .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.deck-sharing input[type=password] { width: 100%; margin-top: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.deck-sharing fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; padding: 12px; min-width: 0; }
.behind { color: var(--dim); }
.deck-sharing .fold { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0 4px; }
.deck-sharing legend { font-weight: 600; overflow-wrap: anywhere; }
.deck-sharing label { display: block; margin: 8px 0; overflow-wrap: anywhere; }
.deck-sharing input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); }
.deck-sharing .recipients { margin: 12px 0 0 20px; }
.deck-sharing .apply-subdecks { margin-top: 8px; }
.deck-sharing .error { color: var(--fire); }
.freeze-panel { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.freeze-heading { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.freeze-heading h3 { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 14px; }
.freeze-badge { padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--ice) 15%, transparent); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.freeze-panel[data-state=off] .freeze-badge { color: var(--dim); background: var(--h0); }
.freeze-main { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
.freeze-main strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.freeze-main p { margin: 3px 0 0; font-size: 12px; color: var(--dim); }
.freeze-display { display: flex; flex-shrink: 0; gap: 4px; }
.freeze-slot { width: 38px; height: 52px; display: grid; place-items: center; }
.freeze-slot svg { width: 36px; height: 46px; overflow: visible; }
.freeze-slot .shell { fill: color-mix(in srgb, var(--ice) 5%, var(--card)); stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 3 3; }
.freeze-slot .facet, .freeze-slot .flame, .freeze-slot .glint { opacity: 0; }
.freeze-slot.filled { background: radial-gradient(ellipse, #50beef25, transparent 70%); }
.freeze-slot.filled .shell { fill: #259dd9; stroke: #1575ae; stroke-dasharray: none; }
.freeze-slot.filled .facet, .freeze-slot.filled .flame, .freeze-slot.filled .glint { opacity: 1; }
.freeze-slot .facet-left { fill: #70d9fa; }
.freeze-slot .facet-top { fill: #b3efff; }
.freeze-slot .facet-right { fill: #1382c7; }
.freeze-slot .flame { fill: #edfcff; }
.freeze-slot .glint { fill: none; stroke: white; stroke-width: 1.4; stroke-linecap: round; }
.freeze-display.off .filled { filter: saturate(0.35); opacity: 0.65; }
.freeze-button, .freeze-settings input { font: inherit; }
.freeze-button { font-size: 13px; }
.freeze-button:hover { border-color: var(--accent); }
.freeze-button:focus-visible, .freeze-settings input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.freeze-button:disabled { cursor: default; opacity: 0.55; }
.freeze-button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
dialog.freeze-settings { width: min(480px, calc(100% - 32px)); max-height: 85vh; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); }
dialog.freeze-settings::backdrop { background: #0008; }
.freeze-settings h3 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.freeze-settings .intro { margin: 4px 0 16px; color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.freeze-settings .rules { display: grid; gap: 10px; margin: 0 0 18px; padding-left: 20px; font-size: 13px; }
.freeze-settings .rules li::marker { color: var(--ice); }
.freeze-settings .token-label { display: block; font-size: 13px; font-weight: 600; }
.freeze-settings input[type=password] { width: 100%; margin-top: 6px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
.freeze-settings .token-help { margin: 8px 0 12px; font-size: 12px; color: var(--dim); }
.freeze-settings .freeze-balance { display: flex; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.freeze-settings .freeze-balance strong { display: block; font-size: 16px; }
.freeze-settings .freeze-toggle { display: flex; gap: 12px; align-items: center; padding: 14px; margin: 6px 0 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.freeze-settings .freeze-toggle input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
.freeze-settings .freeze-toggle strong { display: block; font-size: 14px; }
.freeze-settings .freeze-toggle small { display: block; margin-top: 2px; color: var(--dim); font-size: 12px; }
.freeze-settings .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
.freeze-settings .status { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: var(--dim); }
.freeze-settings .status.error { color: var(--fire); }
.notification-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.deck-sharing .notification-actions button { min-height: 44px; }
.notification-settings input[type=text] { width: 100%; margin-top: 6px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
.notification-settings .account-label { display: block; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
.notification-settings .receive-toggle, .notification-settings .mute-person { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; }
.notification-settings .receive-toggle { margin-bottom: 14px; }
.notification-settings .receive-toggle input, .notification-settings .mute-person input { width: 20px; height: 20px; flex: 0 0 20px; margin: 1px 0 0; accent-color: var(--accent); }
.notification-settings .receive-toggle strong { display: block; font-size: 14px; }
.notification-settings .receive-toggle small, .notification-settings .mute-person small { display: block; margin-top: 3px; font-size: 12px; color: var(--dim); }
.notification-settings fieldset { min-width: 0; margin: 0 0 16px; padding: 0; border: 0; }
.notification-settings legend { padding: 0; font-size: 14px; font-weight: 600; }
.notification-settings .mute-person { margin-top: 8px; font-size: 13px; cursor: pointer; }
.notification-settings .mute-person:has(input:disabled) { opacity: 0.65; cursor: default; }
.notification-settings .scope-note { margin: 12px 0; font-size: 12px; color: var(--dim); }
.notification-settings .rules { margin-bottom: 16px; }
.notification-settings .rules li::marker { color: var(--accent); }
.notification-settings :focus-visible, .deck-sharing .notification-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.notification-settings h3, .notification-settings .scope-note { overflow-wrap: anywhere; }
@media (max-width: 420px) {
  .freeze-main, .freeze-settings .freeze-balance { gap: 10px; }
  .freeze-slot { width: 30px; }
  .freeze-slot svg { width: 30px; }

}
@media (max-width: 700px) {
  .profile-layout, .records { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .profile-layout > .wide { grid-column: auto; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .dashboard { gap: 16px; }
  .dashboard > .page-hero { margin-bottom: -16px; }
  .board li { grid-template-columns: 25px minmax(0, 1fr) auto; gap: 9px; padding: 14px 6px; }
  .board .rank { font-size: 16px; }
  .board .player-cell { gap: 8px; }
  .board .avatar { width: 30px; height: 30px; border-radius: 10px; font-size: 10px; }
  .board .line { flex-wrap: wrap; align-items: center; gap: 3px 7px; }

  .board .lvl { margin-left: 0; font-size: 10px; }
  .board .streak { font-size: 10px; }

.embedded .leaderboard-kpis, .embedded .site-footer { display: none; }
.dashboard button, dialog button { min-height:48px; }
dialog .fold { min-width:48px; }

<body>
<a class="skip" href="#app">Skip to main content</a>
<div class="shell">
  <header class="topbar" data-site-header data-site-section="leaderboard"></header>
  <main id="app" class="dashboard" tabindex="-1" aria-busy="true"><p class="loading-copy" role="status">Loading your community…</p></main>
  <footer class="footer site-footer">A little progress, every day. <a data-community-link href="/community">Explore your community’s milestones →</a></footer>
</div>
<dialog id="deck-sharing" class="deck-sharing" aria-labelledby="deck-sharing-title"></dialog>
<dialog id="streak-freezes" class="freeze-settings" aria-labelledby="freeze-title" aria-describedby="freeze-intro"></dialog>
<dialog id="notification-preferences" class="freeze-settings notification-settings" aria-labelledby="notification-title" aria-describedby="notification-intro" data-notification-dialog></dialog>
<script>
const app = document.getElementById("app");
document.querySelector("[data-site-header]").dataset.siteSection = location.pathname.replace(/\/+$/, "") === "/records" ? "records" : "leaderboard";
document.querySelector("[data-community-link]").href = AnkiQuestSite.href("/community");
document.querySelector(".skip").addEventListener("click", event => { event.preventDefault(); app.focus(); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => n.toLocaleString();
const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;

let weekEnds = 0;
let renderId = 0, privatePageHidden = false, knownMember;
function closePersonalSettings() {
  renderId++;
  for(const id of ["deck-sharing","streak-freezes","notification-preferences"]) {
    const dialog=document.getElementById(id);if(dialog.open)dialog.close();
  }
}
addEventListener("ankiquest:locked",()=>{settingsTokens.clear();delete window.ankiquestSession;closePersonalSettings();app.innerHTML="";});
addEventListener("ankiquest:identity",event=>{const user=event.detail.user;if(knownMember&&knownMember!==user){settingsTokens.clear();closePersonalSettings();}knownMember=user;});
addEventListener("pagehide",()=>{privatePageHidden=true;settingsTokens.clear();closePersonalSettings();});
addEventListener("pageshow",()=>{privatePageHidden=false;});
const winnerState = { data: null, scope: "shared", metric: "day", error: false, request: 0 };
const settingsOpen = () => AnkiQuestAvatars.isOpen() || document.getElementById("deck-sharing").open || document.getElementById("streak-freezes").open || document.getElementById("notification-preferences").open;
// Page memory only: share credentials between settings dialogs, never between players.
const settingsTokens = new Map();
let nativeSettingsCleared = false, previousNativeSettings = nativeSettingsIdentity();
addEventListener("ankiquest-auth", () => {
  const identity = nativeSettingsIdentity();
  nativeSettingsCleared = !identity;
  if (!identity || identity !== previousNativeSettings) {
    settingsTokens.clear();
    const recipientDialog = document.getElementById("notification-preferences");
    if (recipientDialog?.open) recipientDialog.close();
  }
  previousNativeSettings = identity;
});
function nativeSettingsToken(user) {
  const session = window.ankiquestSession;
  return session?.user === user && typeof session.token === "string" && session.token.trim()
    ? session.token.trim() : "";
}
function nativeSettingsIdentity() {
  const session = window.ankiquestSession;
  return typeof session?.user === "string" && session.user && typeof session.token === "string" && session.token.trim()
    ? JSON.stringify([session.user, session.token.trim()]) : "";
}
function settingsToken(user) {
  return nativeSettingsToken(user) || settingsTokens.get(user) || "";
}
function forgetSettingsToken(user, failedToken) {
  if (settingsTokens.get(user) === failedToken) settingsTokens.delete(user);
  if (nativeSettingsToken(user) === failedToken) delete window.ankiquestSession;
}

function connectSettingsAuth({ user, form, input, controller, load, clear, show, say, useSession }) {
  let busy = false, unlocked = false, generation = 0, queued = false;
  let activeToken = "", fromNative = false, observedNative = nativeSettingsIdentity(), cookieSession = null;
  const content = form.parentElement;
  const button = form.querySelector("button");
  const reset = (message = "") => {
    if (controller.signal.aborted) return;
    unlocked = false;
    activeToken = "";
    fromNative = false;
    cookieSession = null;
    observedNative = nativeSettingsIdentity();
    clear();
    input.value = "";
    input.required = true;
    form.hidden = false;
    content.replaceChildren(form);
    say(message, Boolean(message));
    input.focus();
  };
  const unlock = async (token, session = null) => {
    if (busy || unlocked || controller.signal.aborted) return;
    if (!token && !session) { input.focus(); return; }
    const attempt = generation;
    const startedNative = Boolean(token) && nativeSettingsToken(user) === token;
    activeToken = token;
    fromNative = startedNative;
    busy = true;
    input.value = "";
    form.hidden = true;
    button.disabled = true;
    say("Loading settings…");
    try {
      const data = await load(token, session);
      if (!controller.signal.aborted && attempt === generation) {
        if (startedNative && nativeSettingsToken(user) !== token) { queued = true; return; }
        // Native credentials remain owned by the host, so clearing its session
        // cannot leave a second copy available for a later dialog.
        if (startedNative || session || nativeSettingsToken(user) === token) {
          settingsTokens.delete(user);
        } else {
          const connected = await AnkiQuestSite.connectMember(user, token, () => !controller.signal.aborted && attempt === generation);
          if (controller.signal.aborted || attempt !== generation) return;
          nativeSettingsCleared = false;

  const autoUnlock = () => {
    if (controller.signal.aborted) return;
    // An explicit host clear also revokes a cookie session loaded before the first host event.
    if (nativeSettingsCleared && (cookieSession || activeToken)) {

let notificationDialogSession = 0;
const PERIODS = { hour: "This hour", day: "Today", week: "This week", month: "This month", year: "This year", all: "All time" };

const WINDOWS = { hour: "Best hour", day: "Best day", week: "Best week", month: "Best month", year: "Best year" };
const RECORDS = { ...WINDOWS, streak: "Longest streak", days: "Days studied" };
const SINCE = { streak: "ended", days: "since" };

function currentView() {
  const name = location.pathname.replace(/\/+$/, "").split("/").pop();
  if (name === "records") return "records";
  return name in PERIODS ? name : "week";
}

function currentPeriod() {
  const view = currentView();
  return view === "records" ? "week" : view;
}

function tabs(active) {
  const links = Object.entries(PERIODS).map(([name, label]) =>
    `<a ${name === active ? 'aria-current="page"' : ""} href="${AnkiQuestSite.href("/" + name, location.hash)}">${label}</a>`);
  return `<nav class="tabs" aria-label="Leaderboard period">${links.join("")}</nav>`;

function pageHero(title, description, note = "") {
  return `<div class="page-hero"><div><div class="eyebrow">A little progress, every day</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${note ? `<div class="history-note">${note}</div>` : ""}</div>`;

function leaderboardKpis(rows, period) {
  const total = rows.reduce((sum, row) => sum + (row.xp ?? row.week_xp ?? 0), 0);
  const reviews = rows.reduce((sum, row) => sum + row.today_reviews, 0);
  const bestStreak = Math.max(0, ...rows.map(row => row.streak));
  return '<div class="kpis leaderboard-kpis">' +
    AnkiQuestSite.kpi("Community XP", num(total), PERIODS[period], "gold") +
    AnkiQuestSite.kpi("Reviews today", num(reviews), "Every card is a little progress", "blue") +
    AnkiQuestSite.kpi("Study buddies", num(rows.length), "Growing together") +
    AnkiQuestSite.kpi("Longest active streak", num(bestStreak) + " days", "One study day at a time", "green") + '</div>';

function records(rows, me) {
  const held = Object.fromEntries(rows.map(row => [row.window, row]));
  if (!rows.some(row => (row.holders ?? []).length)) return `<p class="empty">Nobody has earned any XP yet.</p>`;
  return `<div class="records">${Object.entries(RECORDS).map(([window, label]) => {
    const row = held[window];
    const [best, ...rest] = row?.holders ?? [];
    if (!best) return "";
    const unit = row.unit === "days" ? "days" : "XP";
    const when = new Date(best.at).toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
    const entry = (holder, place, lead) => `
      <div class="entry ${lead ? "lead" : "chase"}${holder.user === me ? " mine" : ""}">
        <span class="place">${place}</span>
        <a href="${AnkiQuestSite.href("/week", "#" + encodeURIComponent(holder.user))}">${esc(holder.display)}</a>
        <span class="value">${num(holder.value)}${lead ? `<small>${unit}</small>` : ""}</span>
        <span class="behind">${lead ? "" : `−${num(best.value - holder.value)}`}</span>
        <div class="bar${lead ? " gold" : ""}"><i style="width:${pct(holder.value, best.value)}%"></i></div>
      </div>`;
    return `<article class="card record">
      <h3>${label}<em>${SINCE[window] ? `${SINCE[window]} ${when}` : when}</em></h3>
      ${entry(best, "🏆", true)}
      ${best.detail ? `<div class="detail">${num(best.detail)} reviews</div>` : ""}
      ${rest.map((holder, index) => entry(holder, index + 2, false)).join("")}
    </article>`;
  }).join("")}</div>`;
}

function bests(player) {
  const windows = Object.entries(WINDOWS).map(([window, label]) => {
    const record = player.records?.[window] ?? { xp: 0, reviews: 0 };
    return `<div class="stat"><b>${num(record.xp)}</b><span>${label.toLowerCase()} · ${num(record.reviews)} reviews</span></div>`;
  });
  windows.push(`<div class="stat"><b>${player.lifetime.best_streak}</b><span>longest streak</span></div>`);
  windows.push(`<div class="stat"><b>${num(player.lifetime.days_active)}</b><span>days studied</span></div>`);
  return `<div class="stats">${windows.join("")}</div>`;
}

function boardTitle(period) {
  if (period !== "week") return PERIODS[period];
  const left = weekEnds - Date.now();
  if (left <= 0) return "This week";
  const h = Math.floor(left / 3600000), d = Math.floor(h / 24);
  const when = new Date(weekEnds).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
  return `This week · resets in ${d ? `${d}d ${h % 24}h` : h ? `${h}h` : "<1h"}<span class="sub"> · ${when}</span>`;
}

function board(rows, me) {

  if (rows.every(row => (row.xp ?? row.week_xp) === 0)) return `<p class="empty">No XP in this period yet.</p>`;
  const xpOf = row => row.xp ?? row.week_xp;
  const lead = Math.max(1, xpOf(rows[0]));
  return `<ol class="board">${rows.map((r, i) => `
    <li class="${[r.user === me && "me", i === 0 && xpOf(r) > 0 && "lead"].filter(Boolean).join(" ")}">

          ${r.streak > 0 ? `<span class="streak">🔥${r.streak}</span>` : ""}
          <span class="lvl">Lv ${r.level}</span>
        </div>

      </div>
      </div><div class="xp"><b>${num(xpOf(r))}</b><span>${num(r.today_reviews)} today</span></div>
    </li>`).join("")}

}

const winCount = value => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : 0;
function winDate(value) {

}
function winnerContent() {
  const data = winnerState.data, shared = winnerState.scope === "shared", metric = winnerState.metric;
  const heading = `<div class="win-heading"><h2 id="winner-history-title">Winner history</h2><a id="winner-calendar-link" href="${AnkiQuestSite.href("/community?period=" + metric, "#calendar")}">Open winner calendar →</a></div>`;
  const controls = `<div class="win-controls"><div class="win-scopes" role="group" aria-label="Winner history scope"><button type="button" data-win-scope="shared" aria-pressed="${shared}">Shared history</button><button type="button" data-win-scope="lifetime" aria-pressed="${!shared}">Lifetime</button></div><label class="win-sort" for="win-metric">Rank by <select id="win-metric">${[["day","Days won"],["week","Weeks won"],["month","Months won"]].map(([key,label])=>`<option value="${key}"${metric===key?" selected":""}>${label}</option>`).join("")}</select></label></div>`;
  const failure = winnerState.error ? `<p role="status">Winner history could not ${data ? "refresh; showing the last loaded results" : "load"}. <button type="button" data-win-retry>Try again</button></p>` : "";

  const waiting = (data.waiting_players || []).slice().sort((a,b) => lexical(String(a.display),String(b.display)) || lexical(String(a.user),String(b.user)));
  const lifetimeStart = data.meta?.start_source === "configured"
    ? `since the configured server start${data.meta.start_date ? ` on ${esc(winDate(data.meta.start_date))}` : ""}`

function heat(cells) {
  if (!cells.length) return '<span class="sub">Your study history will appear here.</span>';
  const max = Math.max(1, ...cells.map(c => c.reviews));
  const first = new Date(cells[0].date + "T00:00:00Z");
  const pad = (first.getUTCDay() + 6) % 7;
  const level = n => n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / max * 3.999));
  return "<i class='pad'></i>".repeat(pad) + cells.map(c =>
    `<i class="${c.frozen ? "frozen" : "l" + level(c.reviews)}" title="${c.date}: ${c.frozen ? "streak freeze" : num(c.reviews) + " reviews, " + num(c.xp) + " XP"}"></i>`).join("");

    </form></div>
    <p id="deck-status" role="status" aria-live="polite"></p>
    <div class="actions"><button type="button" id="deck-close">Close</button></div>`;
  const content = dialog.querySelector("#deck-sharing-content");
  const status = dialog.querySelector("#deck-status");
  const say = (message, error = false) => {
    status.textContent = message;
    status.className = error ? "error" : "sub";
  };
  const request = async (body) => {
    const requestToken = token, requestSession = session;
    const response = await fetch("/api/decks/" + encodeURIComponent(user), {
      method: body ? "POST" : "GET",
      headers: AnkiQuestSite.ownerHeaders(requestToken ? {user, token: requestToken} : requestSession, body),
      ...(body ? { body: JSON.stringify(body) } : {}),
      cache: "no-store", signal: controller.signal,
    });
    if (controller.signal.aborted || requestToken !== token || requestSession !== session) throw new DOMException("Settings changed.", "AbortError");
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        if (!requestToken) await AnkiQuestSite.checkAccess(response);
        if (controller.signal.aborted || requestToken !== token || requestSession !== session) throw new DOMException("Settings changed.", "AbortError");
        forgetSettingsToken(user, requestToken);
        const message = body === undefined
          ? "That token was not accepted for this player. Check it and try again."
          : "That token is no longer accepted. Enter it again to reload your settings.";
        resetAuth(message);
        throw new Error(message);
      }
      if (response.status === 400 || response.status === 404) throw new Error("The deck or recipient list has changed. Close and reopen this window to refresh it.");
      throw new Error("Could not save or load deck notifications. Please try again.");
    }
    const data = await response.json();
    if (controller.signal.aborted || requestToken !== token || requestSession !== session) throw new DOMException("Settings changed.", "AbortError");
    return data;
  };
  const showDecks = data => {
    data.decks.sort((a, b) => {
      const left = a.name.split("::"), right = b.name.split("::");
      for (let i = 0; i < Math.min(left.length, right.length); i++) {
        const order = left[i].localeCompare(right[i], undefined, { sensitivity: "base" });
        if (order) return order;
      }
      return left.length - right.length;
    });
    const subdecks = deck => data.decks.map((other, i) => other.name.startsWith(deck.name + "::") ? i : -1).filter(i => i >= 0);
    const collapsed = new Set();
    content.innerHTML = `<form id="deck-settings">
      ${data.decks.length ? "" : `<p>No decks have been uploaded yet. Open an updated AnkiQuest client and sync your reviews, then reopen this window. Nudges work without them.</p>`}
      ${data.decks.map((deck, index) => `<fieldset data-deck="${index}" style="margin-left:${(deck.name.split("::").length - 1) * 14}px">
        <legend>${subdecks(deck).length ? `<button type="button" class="fold" aria-expanded="true">▾</button> ` : ""}<span title="${esc(deck.name)}">${esc(deck.name.split("::").pop())}</span></legend>
        <label><input type="checkbox" class="deck-enabled" ${deck.enabled ? "checked" : ""}>Notify people when I finish this deck</label>
        <div class="recipients" ${deck.enabled ? "" : "hidden"}>
          <span class="sub">Notify these people:</span>
          ${data.recipients.map((person, i) => `<label><input type="checkbox" data-recipient="${i}" ${deck.recipients.includes(person.user) ? "checked" : ""}>${esc(person.display)}${person.display !== person.user ? ` <span class="sub">(${esc(person.user)})</span>` : ""}</label>`).join("") || `<p class="sub">No other players are available yet.</p>`}
        </div>
        ${subdecks(deck).length ? `<button type="button" class="apply-subdecks">Apply to ${subdecks(deck).length === 1 ? "its subdeck" : `all ${subdecks(deck).length} subdecks`}</button>` : ""}
      </fieldset>`).join("")}
      <fieldset id="nudge-settings">
        <legend>Nudges</legend>
        <label><input type="checkbox" id="nudge-enabled" ${data.nudges ? "checked" : ""}>Nudge me when a place, a personal best or a level is within reach</label>
        <p class="sub">At most one of each a day, while you are awake and have already studied.</p>
      </fieldset>
      ${data.decks.length ? `<p class="sub">Only selected people receive your name and the deck name. Changes apply to future completions.</p>` : ""}
      <button type="submit">Save preferences</button>
    </form>`;
    const form = content.querySelector("form");
    const fields = form.querySelectorAll("fieldset[data-deck]");
    const refold = () => fields.forEach((field, i) => {
      field.hidden = [...collapsed].some(name => data.decks[i].name.startsWith(name + "::"));
      const fold = field.querySelector(".fold");
      if (!fold) return;
      const folded = collapsed.has(data.decks[i].name);
      fold.textContent = folded ? "▸" : "▾";
      fold.setAttribute("aria-expanded", folded ? "false" : "true");
    });
    fields.forEach((field, i) => field.querySelector(".fold")?.addEventListener("click", () => {
      const name = data.decks[i].name;
      if (!collapsed.delete(name)) collapsed.add(name);
      refold();
    }));
    form.querySelectorAll("fieldset[data-deck]").forEach(field => {
      field.querySelector(".deck-enabled").addEventListener("change", event => {
        field.querySelector(".recipients").hidden = !event.target.checked;
        say("Unsaved changes.");
      });
      field.querySelectorAll("[data-recipient]").forEach(input => input.addEventListener("change", () => say("Unsaved changes.")));
      field.querySelector(".apply-subdecks")?.addEventListener("click", () => {
        const enabled = field.querySelector(".deck-enabled").checked;
        const chosen = [...field.querySelectorAll("[data-recipient]")].map(input => input.checked);
        const fields = form.querySelectorAll("fieldset[data-deck]");
        for (const i of subdecks(data.decks[Number(field.dataset.deck)])) {
          const target = fields[i];
          target.querySelector(".deck-enabled").checked = enabled;
          target.querySelector(".recipients").hidden = !enabled;
          target.querySelectorAll("[data-recipient]").forEach((input, r) => { input.checked = chosen[r]; });
        }
        say("Copied to subdecks. Save to keep it.");
      });
    });
    form.querySelector("#nudge-enabled").addEventListener("change", () => say("Unsaved changes."));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const decks = [...form.querySelectorAll("fieldset[data-deck]")].map((field, i) => ({
        id: data.decks[i].id,
        enabled: field.querySelector(".deck-enabled").checked,
        recipients: [...field.querySelectorAll("[data-recipient]:checked")].map(input => data.recipients[Number(input.dataset.recipient)].user),
      }));
      const invalid = decks.findIndex(deck => deck.enabled && !deck.recipients.length);
      if (invalid >= 0) {
        say(`Select at least one person for ${data.decks[invalid].name}, or turn its notifications off.`, true);
        form.querySelectorAll("fieldset[data-deck]")[invalid].querySelector(".deck-enabled").focus();
        return;
      }
      const controls = [...form.querySelectorAll("input, button")];
      controls.forEach(control => { control.disabled = true; });
      say("Saving…");
      try {
        await request({ decks, nudges: form.querySelector("#nudge-enabled").checked });
        if (!closed && form.isConnected) say("Preferences saved.");
      } catch (error) {
        if (!closed && form.isConnected && error.name !== "AbortError") say(error.message, true);
      } finally {
        controls.forEach(control => { control.disabled = false; });
      }
    });
  };
  dialog.querySelector("#deck-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("close", () => {
    closed = true;
    token = "";
    session = null;
    controller.abort();
    dialog.innerHTML = "";
    render();
  }, { once: true });
  dialog.showModal();
  resetAuth = connectSettingsAuth({
    user, form: content.querySelector("form"), input: dialog.querySelector("#deck-token"), controller,
    load: (value, identity) => { token = value; session = identity; return request(); },
    clear: () => { token = ""; session = null; },
    useSession: identity => { token = identity.token || ""; session = identity; },
    show: data => { showDecks(data); content.querySelector("input, button")?.focus(); }, say,
  });
}

function openNotificationPreferences(user = "", display = "") {
  if (settingsOpen()) return;
  renderId++;
  const dialog = document.getElementById("notification-preferences");
  const session = ++notificationDialogSession;
  const controller = new AbortController();
  const fixedUser = user;
  const opener = document.activeElement;
  let token = "", ownerSession = null, closed = false, busy = false, authController = null, authUser = null;
  let resetAuth = () => {}, playerEdited = false;
  let remembered = "";
  if (!fixedUser) {
    try { remembered = localStorage.getItem("ankiquestPlayer") || ""; } catch (e) {}
  }
  const current = () => !closed && notificationDialogSession === session && dialog.open;
  dialog.innerHTML = `<h3 id="notification-title">Notifications I receive</h3>
    <p id="notification-intro" class="intro">${fixedUser ? `Deck completion alerts for ${esc(display || user)}.` : "Choose which deck completion alerts reach you."} These settings apply across your devices.</p>
    <p class="scope-note">Streak reminders, messages and replies are unaffected.</p>
    <div id="notification-content"><form id="notification-unlock" data-notification-unlock>
      ${fixedUser ? "" : `<label class="account-label" for="notification-player">Your player name
        <input id="notification-player" name="player" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(remembered)}" aria-describedby="notification-player-help" data-notification-player>
        <small id="notification-player-help" class="sub">Use the player name from your AnkiQuest settings.</small>
      </label>`}
      <label class="token-label" for="notification-token">Your AnkiQuest token</label>
      <input id="notification-token" type="password" required autocomplete="off" spellcheck="false" aria-describedby="notification-token-help" data-notification-token>
      <p id="notification-token-help" class="token-help">Connect once with your AnkiQuest token. Your connected account is reused across personal settings.</p>
      <button type="submit" class="freeze-button primary" data-notification-load>Load my settings</button>
    </form></div>
    <p id="notification-status" class="status" role="status" aria-live="polite" data-notification-status></p>
    <div class="actions"><button type="button" id="notification-close" class="freeze-button" data-notification-close>Close</button></div>`;
  const content = dialog.querySelector("#notification-content");
  const status = dialog.querySelector("#notification-status");
  const say = (message, error = false) => {
    if (!current()) return;
    status.textContent = message;
    status.className = "status" + (error ? " error" : "");
  };
  const request = async body => {
    const loading = body === undefined;
    const requestUser = user, requestToken = token, requestSession = ownerSession, requestController = authController;
    const active = () => current() && !requestController.signal.aborted && requestUser === user && requestToken === token && requestSession === ownerSession;
    const response = await fetch("/api/deck-subscriptions/" + encodeURIComponent(requestUser), {
      method: loading ? "GET" : "POST",
      headers: AnkiQuestSite.ownerHeaders(requestToken ? {user:requestUser, token:requestToken} : requestSession, body),
      ...(loading ? {} : { body: JSON.stringify(body) }),
      cache: "no-store", signal: requestController.signal,
    });
    if (!active()) throw new DOMException("Settings changed.", "AbortError");
    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        if (!requestToken) await AnkiQuestSite.checkAccess(response);
        if (!active()) throw new DOMException("Settings changed.", "AbortError");
        forgetSettingsToken(requestUser, requestToken);
        const message = loading
          ? "That token was not accepted for this player. Check your player name and token, then try again."
          : "That token is no longer accepted. Enter it again to reload your settings.";
        resetAuth(message);
        throw new Error(message);
      }
      throw new Error(loading ? "Could not load your notification settings. Please try again."
        : "Could not save your notification settings. Your changes are still here; please try again.");
    }
    const data = await response.json();
    if (!active()) throw new DOMException("Settings changed.", "AbortError");
    if (!data || typeof data.enabled !== "boolean" || !Array.isArray(data.muted_senders) ||
        !data.muted_senders.every(sender => typeof sender === "string" && sender.length > 0) ||
        !Array.isArray(data.unsubscribed_senders) || !data.unsubscribed_senders.every(sender => typeof sender === "string" && sender.length > 0) ||
        !Array.isArray(data.sharing_senders) || !data.sharing_senders.every(sender => typeof sender === "string" && sender.length > 0) ||
        !Array.isArray(data.senders) || !data.senders.every(sender => sender && typeof sender.user === "string" && sender.user.length > 0 && typeof sender.display === "string")) {
      throw new Error("The server returned unexpected notification settings. Please try again.");
    }
    return data;
  };
  const showSettings = data => {
    if (!current()) return;
    const unsubscribed = new Set([...data.unsubscribed_senders, ...data.muted_senders]);
    const relevant = new Set([...data.sharing_senders, ...unsubscribed]);
    const people = new Map(data.senders.filter(person => relevant.has(person.user)).map(person => [person.user, person]));
    // Keep subscriptions and previous mutes editable for former players too.
    for (const sender of unsubscribed) if (!people.has(sender)) people.set(sender, { user: sender, display: sender });
    const senders = [...people.values()].sort((a, b) => a.display.localeCompare(b.display) || a.user.localeCompare(b.user));
    dialog.querySelector("#notification-intro").textContent = `Deck completion alerts for ${fixedUser ? display || user : user}. These settings apply across your devices.`;
    content.innerHTML = `<form id="notification-settings" data-notification-settings>
      <label class="receive-toggle" for="notification-enabled">
        <input id="notification-enabled" type="checkbox" role="switch" ${data.enabled ? "checked" : ""} data-receiving-enabled>
        <span><strong>Receive deck completion notifications</strong><small>Turn off to stop all deck completion alerts.</small></span>
      </label>
      <fieldset aria-describedby="notification-subscription-help">
        <legend>Unsubscribe from specific people</legend>
        <p id="notification-subscription-help" class="scope-note">A checked name removes you from all of their deck-sharing lists. They cannot add you back. Clear the name and save to subscribe again.</p>
        ${senders.map((person, index) => `<label class="mute-person" for="notification-sender-${index}">
          <input id="notification-sender-${index}" type="checkbox" data-unsubscribed-sender="${esc(person.user)}" ${unsubscribed.has(person.user) ? "checked" : ""}>
          <span>Unsubscribe from ${esc(person.display || person.user)}${person.display && person.display !== person.user ? `<small>${esc(person.user)}</small>` : ""}</span>
        </label>`).join("") || `<p class="sub">No one is sharing decks with you yet. You can still turn all deck completion alerts off.</p>`}
      </fieldset>
      ${data.muted_senders.length ? `<p class="scope-note">Your previous mutes are selected above. Saving also removes you from those people’s sharing lists.</p>` : ""}
      <ul class="rules">
        <li>Turning all alerts off cancels pending deck completion alerts without changing your subscriptions.</li>
        <li>Unsubscribing cancels that person’s pending completion alerts and removes matching alerts from your inbox.</li>
        <li>Subscribing again restores your previous deck selections unless the sender has changed or deleted them. Only new completions are sent; old alerts are not replayed.</li>
      </ul>
      <button type="submit" class="freeze-button primary" data-notification-save>Save preferences</button>
    </form>`;
    const form = content.querySelector("form");
    const enabled = form.querySelector("#notification-enabled");
    const senderInputs = [...form.querySelectorAll("[data-unsubscribed-sender]")];
    const saveButton = form.querySelector("[data-notification-save]");
    const syncControls = () => {
      form.setAttribute("aria-busy", String(busy));
      enabled.disabled = busy;
      saveButton.disabled = busy;
      senderInputs.forEach(input => { input.disabled = busy; });
    };
    enabled.addEventListener("change", () => { syncControls(); say("Unsaved changes. Save to apply them."); });
    senderInputs.forEach(input => input.addEventListener("change", () => say("Unsaved changes. Save to apply them.")));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy || !current()) return;
      const draft = { enabled: enabled.checked, unsubscribed_senders: senderInputs.filter(input => input.checked).map(input => input.dataset.unsubscribedSender) };
      busy = true;
      syncControls();
      say("Saving…");
      try {
        const saved = await request(draft);
        if (current()) {
          busy = false;
          showSettings(saved);
          say(saved.enabled ? "Preferences saved. Your sender subscriptions have been updated."
            : "Preferences saved. All deck completion alerts are off. Your sender subscriptions are saved.");
          content.querySelector("[data-notification-save]").focus();
        }
      } catch (error) {
        if (current()) say(error.message, true);
      } finally {
        busy = false;
        if (current() && form.isConnected) syncControls();
      }
    });
    syncControls();
  };
  const form = content.querySelector("form"), input = form.querySelector("#notification-token"), player = form.querySelector("#notification-player");
  const bindAccount = target => {
    if (!current() || !target || target === authUser) return;
    authController?.abort();
    authController = new AbortController();
    const binding = authController;
    controller.signal.addEventListener("abort", () => binding.abort(), {once:true});
    authUser = user = target; token = ""; ownerSession = null;
    if (player) player.value = target;
    resetAuth = connectSettingsAuth({
      user, form, input, controller:authController,
      load: (value, identity) => { token = value; ownerSession = identity; return request(); },
      clear: () => { token = ""; ownerSession = null; },
      useSession: identity => { token = identity.token || ""; ownerSession = identity; },
      show: data => { showSettings(data); content.querySelector("#notification-enabled").focus(); }, say,
    });
  };
  // A leaderboard visitor may choose a player; once connected, the same shared
  // auth helper used by deck/freeze preferences owns all loading and retries.
  form.addEventListener("submit", event => {
    playerEdited = true;
    const target = fixedUser || player.value.trim();
    if (target === authUser) return;
    event.preventDefault();event.stopImmediatePropagation();
    if (!target) { player.focus();return; }
    bindAccount(target);
    // A new task avoids the browser's re-entrant form-submission guard.
    setTimeout(() => { if (current()) form.requestSubmit(); }, 0);
  });
  player?.addEventListener("input", () => { playerEdited = true; });
  const finish = () => {
    if (closed) return;
    closed = true;
    token = "";
    ownerSession = null;
    controller.abort();
    dialog.removeEventListener("close", onClose);
    dialog.removeEventListener("cancel", onCancel);
    if (notificationDialogSession !== session) return;
    dialog.innerHTML = "";
    render().then(() => {
      if (notificationDialogSession === session && !settingsOpen() &&
          (document.activeElement === document.body || document.activeElement === opener)) {
        document.getElementById("manage-received-notifications")?.focus();
      }
    });
  };
  const close = () => { dialog.close(); finish(); };
  const onClose = () => { if (!dialog.open) finish(); };
  const onCancel = event => { event.preventDefault(); close(); };
  dialog.querySelector("#notification-close").addEventListener("click", close);
  dialog.addEventListener("close", onClose);
  dialog.addEventListener("cancel", onCancel);
  dialog.showModal();
  const native = window.ankiquestSession;
  if (fixedUser) bindAccount(fixedUser);
  else if (nativeSettingsIdentity()) bindAccount(native.user);
  else AnkiQuestSite.member().then(identity => {
    if (!current() || playerEdited || nativeSettingsCleared || nativeSettingsIdentity()) return;
    if (identity) bindAccount(identity.user);
    else if (remembered) bindAccount(remembered);
  });
}

    render().then(() => {
      if (!settingsOpen() && decodeURIComponent(location.hash.slice(1)) === user &&
          (document.activeElement === document.body || document.activeElement?.id === "manage-freezes")) {
        document.getElementById("manage-freezes")?.focus();
      }
    });
  }, { once: true });
  dialog.showModal();
  resetAuth = connectSettingsAuth({
    user, form: content.querySelector("form"), input: dialog.querySelector("#freeze-token"), controller,
    load: (value, identity) => { token = value; session = identity; return request(); },
    clear: () => { token = ""; session = null; },
    useSession: identity => { token = identity.token || ""; session = identity; },
    show: data => { showSettings(data); content.querySelector("#freeze-enabled").focus(); }, say,
  });
}

async function render() {
  if (settingsOpen() || privatePageHidden) return;
  const id = ++renderId;
  const canRender = () => id === renderId && !settingsOpen();
  const user = decodeURIComponent(location.hash.slice(1));
  try {
    let me = "";
    try { me = localStorage.getItem("ankiquestPlayer") || ""; } catch (e) {}
    if (currentView() === "records") {
      const held = await AnkiQuestSite.readJSON("/api/records");
      if (!canRender()) return;
      document.title = "Records · AnkiQuest";
      AnkiQuestSite.setProfile(me);
      app.innerHTML = pageHero("Records worth chasing.", "Personal bests become shared milestones. Celebrate the sessions, streaks, and study days that raised the bar.", '<strong>All-time achievements</strong>A new record starts with one session.') + records(held, me) + receivingNotificationsEntry();
      document.getElementById("manage-received-notifications").addEventListener("click", () => openNotificationPreferences());
      return;
    }
    const period = currentPeriod();
    loadWinners();
    const [rows, week] = await Promise.all([
      AnkiQuestSite.readJSON("/api/leaderboard?period=" + period),
      AnkiQuestSite.readJSON("/api/week").catch(() => null),
    ]);
    weekEnds = week?.ends_at ?? 0;
    if (user) {
      const res = await fetch("/api/profile/" + encodeURIComponent(user), {cache: "no-store"});
      await AnkiQuestSite.checkAccess(res);
      if (res.ok) {
        const p = await res.json();
        if (!canRender()) return;
        document.title = `${p.display} · AnkiQuest`;
        AnkiQuestSite.setProfile(p.user, true);
        try { localStorage.setItem("ankiquestPlayer", p.user); } catch (e) {}
        const access = await AnkiQuestSite.status();
        if (!canRender()) return;
        const native = window.ankiquestSession;
        const canEditAvatar = access?.member?.user === p.user || (native?.user === p.user && typeof native.token === "string" && !!native.token.trim());
        app.innerHTML = view(p, rows, canEditAvatar);
        if (canEditAvatar) document.getElementById("manage-avatar").addEventListener("click", () => AnkiQuestAvatars.open({user:p.user,display:p.display}));
        document.getElementById("manage-decks").addEventListener("click", () => openDeckSharing(p.user, p.display));
        document.getElementById("manage-received-notifications").addEventListener("click", () => openNotificationPreferences(p.user, p.display));
        document.getElementById("manage-freezes").addEventListener("click", () => openStreakFreezes(p.user, p.display));
        return;
      }
    }
    if (!canRender()) return;
    document.title = "Leaderboard · AnkiQuest";
    AnkiQuestSite.setProfile(me);
    app.innerHTML = pageHero("Every session counts.", "A little friendly competition, a little more motivation. See how your study community is growing together.", '<strong>Made for steady progress</strong>Standings update as members sync.') + leaderboardKpis(rows, period) + tabs(period) + `<section class="card"><div class="card-head"><div><h2>${boardTitle(period)}</h2><p>XP earned together, one study session at a time.</p></div><span class="chip blue">${num(rows.length)} players</span></div>${board(rows, me)}</section>` + winnerSection() + receivingNotificationsEntry();
    document.getElementById("manage-received-notifications").addEventListener("click", () => openNotificationPreferences());
  } catch (e) {
    if (!canRender()) return;
    app.innerHTML = `<div class="notice error" role="alert">Could not reach the server. <button type="button" id="retry-load">Try again</button></div>`;
    document.getElementById("retry-load").addEventListener("click", render);
  } finally {
    if (canRender()) app.setAttribute("aria-busy", "false");
  }
}

addEventListener("hashchange", render);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && render());
setInterval(render, 30000);
render();
</script>
</body>
</html>
